services:
  postgres:
    image: postgres:16-alpine
    container_name: planix-postgres
    environment:
      POSTGRES_DB: planix
      POSTGRES_USER: planix
      POSTGRES_PASSWORD: planix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planix -d planix"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: planix-bot
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
