services:
  postgres:
    image: postgres:16-alpine
    container_name: planix-postgres
    environment:
      POSTGRES_DB: planix
      POSTGRES_USER: planix
      POSTGRES_PASSWORD: planix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planix -d planix"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: planix-bot
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # web panel: static files + /api proxy to the bot container
  web:
    build: ./web
    container_name: planix-web
    depends_on:
      - bot
    ports:
      - "80:80"
    restart: unless-stopped

  # optional https: run with  docker compose --profile tls up -d
  # set DOMAIN in .env first
  caddy:
    image: caddy:2-alpine
    container_name: planix-caddy
    profiles: ["tls"]
    env_file: .env
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
